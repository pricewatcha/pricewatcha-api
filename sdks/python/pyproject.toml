[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pricewatcha"
version = "0.1.4"
description = "Official Python client for the Pricewatcha REST API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Pricewatcha" }]
keywords = ["pricewatcha", "price-tracking", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpx>=0.30"]

[project.urls]
Homepage = "https://pricewatcha.com"
Documentation = "https://pricewatcha.com/en/developers"
Repository = "https://github.com/pricewatcha/pricewatcha-api"

[tool.hatch.build.targets.wheel]
packages = ["src/pricewatcha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
