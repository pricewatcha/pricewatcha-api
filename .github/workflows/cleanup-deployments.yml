name: Clean up Railway deployments

# Railway legt bei jedem Deploy (inkl. PR-Previews) GitHub-Deployments an,
# wodurch die "Deployments"-Box im oeffentlichen Repo auftaucht. Dieser Workflow
# liest die tatsaechlich vorhandenen Environment-Namen dynamisch aus und raeumt
# deren Deployment-Eintraege weg -- so werden auch neue PR-Environments erfasst.

on:
  deployment_status:        # feuert, sobald Railway einen Status postet
  workflow_dispatch:        # manuelles Ausloesen ueber den Actions-Tab
  schedule:
    - cron: "0 * * * *"     # stuendlich als Sicherheitsnetz

permissions:
  deployments: write        # reicht fuer onlyRemoveDeployments (kein PAT noetig)

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.list.outputs.envs }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          envs=$(gh api /repos/${{ github.repository }}/deployments \
            --paginate --jq '.[].environment' \
            | sort -u | jq -R . | jq -cs .)
          echo "Gefundene Environments: $envs"
          echo "envs=$envs" >> "$GITHUB_OUTPUT"

  cleanup:
    needs: discover
    if: ${{ needs.discover.outputs.envs != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.discover.outputs.envs) }}
    steps:
      - name: Remove deployments for "${{ matrix.environment }}"
        uses: strumwolf/delete-deployment-environment@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: ${{ matrix.environment }}
          onlyRemoveDeployments: true   # loescht nur die Eintraege, kein Admin-Recht noetig
